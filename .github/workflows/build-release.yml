name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/pyinstaller.spec --noconfirm --distpath dist --workpath build

      - name: Assemble Windows package
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          PKG="package/Marketing Intelligence Studio"
          mkdir -p "$PKG"
          cp -r "dist/Marketing Intelligence Studio"/* "$PKG/"
          cp -r clients "$PKG/clients"
          cp .env.example "$PKG/.env.example"
          cp packaging/INSTALL.md "$PKG/HOW TO INSTALL.txt"

      - name: Assemble macOS package
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          PKG="package"
          mkdir -p "$PKG"
          cp -r "dist/Marketing Intelligence Studio.app" "$PKG/"
          cp -r clients "$PKG/clients"
          cp .env.example "$PKG/.env.example"
          cp packaging/INSTALL.md "$PKG/HOW TO INSTALL.txt"

      - name: Add reddit-tool with ready-to-use client configs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            PKG="package/Marketing Intelligence Studio"
          else
            PKG="package"
          fi
          cp -r reddit-tool "$PKG/reddit-tool"
          find "$PKG/reddit-tool" -name "__pycache__" -o -name ".pytest_cache" | xargs -r rm -rf
          # Pre-generate each real client's reddit-tool config so the team doesn't
          # need Python/backend access just to get started — notify_email is a
          # placeholder each person replaces with their own (see REDDIT_TOOL_SETUP.md).
          REDDIT_NOTIFY_EMAIL="REPLACE-WITH-YOUR-EMAIL@example.com" \
            python -m backend.reddit.config_generator --reddit-tool-clients-dir "$PKG/reddit-tool/clients"
          cp packaging/REDDIT_TOOL_SETUP.md "$PKG/reddit-tool/REDDIT_TOOL_SETUP.md"

      - name: Zip package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "package/*" -DestinationPath "MarketingIntelligenceStudio-Windows.zip"

      - name: Zip package (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          cd package
          zip -r "../MarketingIntelligenceStudio-macOS.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: MarketingIntelligenceStudio-${{ matrix.platform == 'windows' && 'Windows' || 'macOS' }}
          path: MarketingIntelligenceStudio-${{ matrix.platform == 'windows' && 'Windows' || 'macOS' }}.zip
          retention-days: 90
