[pytest]
# Scope collection to this project's own tests. reddit-tool/ is a vendored,
# independently-run project (see reddit-tool/README.md) with its own "tests"
# package — without this, a bare `pytest` from the repo root collects both
# and pytest's module-name-based import machinery collides on the shared
# "tests.test_config" etc. module names.
testpaths = tests
